name: Native release builds

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release tag to build and update
        required: true
        type: string

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Check release tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
        run: |
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 0
      - name: Check Windows settings path fix is in the release tag
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          if ! git merge-base --is-ancestor 5191fb68f82635256f3fa6cb1bc0b98ff57c6431 HEAD; then
            echo "::error::Release tag $RELEASE_TAG points to $(git rev-parse --short HEAD), before the Windows settings path fix. Create a release tag at or after 5191fb6."
            exit 1
          fi

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            archive: h5jive-linux-x86_64.tar.gz
          - os: macos-15-intel
            target: x86_64-apple-darwin
            archive: h5jive-macos-x86_64.tar.gz
          - os: macos-15
            target: aarch64-apple-darwin
            archive: h5jive-macos-aarch64.tar.gz
          - os: windows-2022
            target: x86_64-pc-windows-gnu
            archive: h5jive-windows-x86_64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - name: Preserve Unix line endings on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf input

      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ runner.os == 'Windows' && '1.99.0-x86_64-pc-windows-gnu' || '1.99.0' }}
          targets: ${{ matrix.target }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake libclang-dev patchelf pkg-config \
            libhdf5-dev libxcb1-dev libxrandr-dev libdbus-1-dev libx11-dev \
            libwayland-dev libegl-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libgl1-mesa-dev libvulkan-dev

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: brew install hdf5 pkg-config llvm dylibbundler

      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: UCRT64
          path-type: inherit
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-hdf5
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-clang
            mingw-w64-ucrt-x86_64-pkgconf
            zip

      - name: Build on Linux
        if: runner.os == 'Linux'
        run: cargo build --release --locked -p h5jive --target ${{ matrix.target }}

      - name: Build on macOS
        if: runner.os == 'macOS'
        run: |
          export HDF5_DIR="$(brew --prefix hdf5)"
          export SNT3_HDF5_LIB_DIR="$HDF5_DIR/lib"
          export LIBCLANG_PATH="$(brew --prefix llvm)/lib"
          cargo build --release --locked -p h5jive --target ${{ matrix.target }}

      - name: Build on Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          rustc -vV | grep -q 'host: x86_64-pc-windows-gnu'
          export HDF5_DIR=/ucrt64
          export HDF5_ROOT=/ucrt64
          export LIBCLANG_PATH=/ucrt64/bin
          export PKG_CONFIG_PATH=/ucrt64/lib/pkgconfig
          export CMAKE_GENERATOR=Ninja
          # hdf5-metno-sys checks a fixed list of DLL names; MSYS2 uses a versioned name.
          hdf5_dll=$(find /ucrt64/bin -maxdepth 1 -type f -name 'libhdf5-*.dll' -print -quit)
          if [ -z "$hdf5_dll" ]; then
            echo 'HDF5 runtime DLL was not found in /ucrt64/bin' >&2
            exit 1
          fi
          cp "$hdf5_dll" /ucrt64/bin/hdf5.dll
          # Build the pinned SNT3 source with its MinGW TLS linker fix.
          source .github/scripts/build-snt3-windows.sh
          cargo build --release --locked -p h5jive --target ${{ matrix.target }}

      - name: Package Linux executable
        if: runner.os == 'Linux'
        run: |
          mkdir -p bundle/lib dist
          cp target/${{ matrix.target }}/release/h5jive bundle/
          cp -R settings/runtime bundle/settings
          printf '# Local settings overrides\n' > bundle/settings/overrides.dip
          cp README.md LICENSE bundle/
          # Keep HDF5 and its compression helpers beside the program.
          ldd bundle/h5jive | awk '/=> \/.*lib(hdf5[^.]*|sz|aec|z)\.so/ {print $3}' | while read -r library; do
            cp -L "$library" bundle/lib/
          done
          patchelf --set-rpath '$ORIGIN/lib' bundle/h5jive
          for library in bundle/lib/*.so*; do
            [ -e "$library" ] && patchelf --set-rpath '$ORIGIN' "$library"
          done
          ldd bundle/h5jive | awk '/libhdf5/ && !/bundle\/lib/ {print "HDF5 library is not bundled: " $0 > "/dev/stderr"; exit 1}'
          bundle_exe="$PWD/bundle/h5jive"
          (cd "$(mktemp -d)" && "$bundle_exe" --inspect)
          tar -C bundle -czf dist/${{ matrix.archive }} .

      - name: Package macOS executable and libraries
        if: runner.os == 'macOS'
        run: |
          mkdir -p bundle/lib dist
          cp target/${{ matrix.target }}/release/h5jive bundle/
          cp -R settings/runtime bundle/settings
          printf '# Local settings overrides\n' > bundle/settings/overrides.dip
          cp README.md LICENSE bundle/
          dylibbundler -b -x bundle/h5jive -d bundle/lib -p @executable_path/lib
          find bundle/lib -type f -name '*.dylib' -exec codesign --force --sign - {} \;
          codesign --force --sign - bundle/h5jive
          bundle_exe="$PWD/bundle/h5jive"
          (cd "$(mktemp -d)" && "$bundle_exe" --inspect)
          tar -C bundle -czf dist/${{ matrix.archive }} .

      - name: Package Windows executable and libraries
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          mkdir -p bundle dist
          cp target/${{ matrix.target }}/release/h5jive.exe bundle/
          cp -R settings/runtime bundle/settings
          printf '# Local settings overrides\n' > bundle/settings/overrides.dip
          cp README.md LICENSE bundle/
          # Ship the UCRT64 DLLs referenced by the executable, including HDF5.
          ldd bundle/h5jive.exe | awk '/\/ucrt64\/bin\// {print $3}' | while read -r dll; do
            cp "$dll" bundle/
          done
          bundle_exe="$PWD/bundle/h5jive.exe"
          (cd "$(mktemp -d)" && "$bundle_exe" --inspect)
          (cd bundle && zip -qr ../dist/${{ matrix.archive }} .)

      - name: Build Linux AppImage
        if: runner.os == 'Linux'
        run: sh .github/scripts/package-linux-appimage.sh

      - name: Build macOS disk image
        if: runner.os == 'macOS'
        run: sh .github/scripts/package-macos-dmg.sh ${{ matrix.target == 'x86_64-apple-darwin' && 'x86_64' || 'aarch64' }}

      - name: Install Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build and smoke test Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Select-String -Path crates/h5jive/Cargo.toml -Pattern '^version = "([^"]+)"' | Select-Object -First 1).Matches.Groups[1].Value
          $env:H5JIVE_VERSION = $version
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' '.github\scripts\h5jive.iss'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installer = (Resolve-Path 'dist\h5jive-windows-x86_64-setup.exe').Path
          $installDir = Join-Path $env:RUNNER_TEMP 'H5JiveInstallerTest'
          $process = Start-Process -FilePath $installer -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$installDir`"") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          & (Join-Path $installDir 'h5jive.exe') --inspect
          if ($LASTEXITCODE -ne 0) { throw 'Installed app could not read its settings.' }
          if (-not (Test-Path (Join-Path $installDir 'settings\DIPfile'))) { throw 'Installed DIPL settings are missing.' }

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: dist/*
          if-no-files-found: error

  attach:
    needs: [prepare, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: h5jive-*
          path: dist
          merge-multiple: true
      - name: Attach native downloads to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          (cd dist && sha256sum h5jive-* > SHA256SUMS)
          gh release upload "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
