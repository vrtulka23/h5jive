name: Native release builds

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release tag to build and update
        required: true
        type: string

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Check release tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
        run: |
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 0
      - name: Check Windows settings path fix is in the release tag
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          if ! git merge-base --is-ancestor 5191fb68f82635256f3fa6cb1bc0b98ff57c6431 HEAD; then
            echo "::error::Release tag $RELEASE_TAG points to $(git rev-parse --short HEAD), before the Windows settings path fix. Create a release tag at or after 5191fb6."
            exit 1
          fi

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            archive: h5jive-linux-x86_64.tar.gz
          - os: macos-15-intel
            target: x86_64-apple-darwin
            archive: h5jive-macos-x86_64.tar.gz
          - os: macos-15
            target: aarch64-apple-darwin
            archive: h5jive-macos-aarch64.tar.gz
          - os: windows-2022
            target: x86_64-pc-windows-gnu
            archive: h5jive-windows-x86_64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - name: Preserve Unix line endings on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf input

      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ runner.os == 'Windows' && '1.99.0-x86_64-pc-windows-gnu' || '1.99.0' }}
          targets: ${{ matrix.target }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake libclang-dev patchelf pkg-config \
            libaec-dev zlib1g-dev libxcb1-dev libxrandr-dev libdbus-1-dev libx11-dev \
            libwayland-dev libegl-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libgl1-mesa-dev libvulkan-dev

      - name: Build Linux HDF5 without a libcurl dependency
        if: runner.os == 'Linux'
        shell: bash
        run: |
          hdf5_version=1.10.11
          hdf5_sha256=341684c5c0976b8c7e6951735a400275a90693604464cac73e9f323c696fc79c
          hdf5_archive="$RUNNER_TEMP/hdf5-$hdf5_version.tar.gz"
          hdf5_prefix="$RUNNER_TEMP/hdf5-no-curl"
          curl -fsSLo "$hdf5_archive" \
            "https://support.hdfgroup.org/ftp/HDF5/releases/hdf5-1.10/hdf5-$hdf5_version/src/hdf5-$hdf5_version.tar.gz"
          printf '%s  %s\n' "$hdf5_sha256" "$hdf5_archive" | sha256sum --check
          tar -xzf "$hdf5_archive" -C "$RUNNER_TEMP"
          cmake -S "$RUNNER_TEMP/hdf5-$hdf5_version" -B "$RUNNER_TEMP/hdf5-build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$hdf5_prefix" \
            -DHDF5_INSTALL_LIB_DIR=lib \
            -DBUILD_SHARED_LIBS=ON -DBUILD_STATIC_LIBS=OFF \
            -DBUILD_TESTING=OFF -DHDF5_BUILD_TOOLS=OFF \
            -DHDF5_BUILD_CPP_LIB=OFF -DHDF5_BUILD_HL_LIB=OFF \
            -DHDF5_ENABLE_THREADSAFE=ON \
            -DHDF5_ENABLE_Z_LIB_SUPPORT=ON -DHDF5_ENABLE_SZIP_SUPPORT=ON \
            -DHDF5_ENABLE_ROS3_VFD=OFF
          cmake --build "$RUNNER_TEMP/hdf5-build" --parallel 4
          cmake --install "$RUNNER_TEMP/hdf5-build"
          if readelf -d "$hdf5_prefix/lib/libhdf5.so" | grep -F 'libcurl'; then
            echo 'Bundled HDF5 must not depend on libcurl' >&2
            exit 1
          fi
          echo "HDF5_DIR=$hdf5_prefix" >> "$GITHUB_ENV"
          echo "HDF5_ROOT=$hdf5_prefix" >> "$GITHUB_ENV"
          echo "SNT3_HDF5_LIB_DIR=$hdf5_prefix/lib" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$hdf5_prefix/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: brew install hdf5 pkg-config llvm dylibbundler

      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: UCRT64
          path-type: inherit
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-hdf5
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-clang
            mingw-w64-ucrt-x86_64-pkgconf
            zip

      - name: Build on Linux
        if: runner.os == 'Linux'
        run: |
          # Cargo executes build scripts before the release binary gets its bundled-library rpath.
          export LD_LIBRARY_PATH="$SNT3_HDF5_LIB_DIR${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          cargo build --release --locked -p h5jive --target ${{ matrix.target }}

      - name: Build on macOS
        if: runner.os == 'macOS'
        run: |
          export HDF5_DIR="$(brew --prefix hdf5)"
          export SNT3_HDF5_LIB_DIR="$HDF5_DIR/lib"
          export LIBCLANG_PATH="$(brew --prefix llvm)/lib"
          cargo build --release --locked -p h5jive --target ${{ matrix.target }}

      - name: Build on Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          # Consume all output; grep -q can close rustc's pipe early on Windows.
          rustc -vV | grep -F 'host: x86_64-pc-windows-gnu'
          export HDF5_DIR=/ucrt64
          export HDF5_ROOT=/ucrt64
          export LIBCLANG_PATH=/ucrt64/bin
          export PKG_CONFIG_PATH=/ucrt64/lib/pkgconfig
          export CMAKE_GENERATOR=Ninja
          # The GNU Rust host also links the SNT3 C++ library in h5jive/build.rs.
          export RUSTFLAGS="-C link-arg=-lstdc++"
          # hdf5-metno-sys checks a fixed list of DLL names; MSYS2 uses a versioned name.
          hdf5_dll=$(find /ucrt64/bin -maxdepth 1 -type f -name 'libhdf5-*.dll' -print -quit)
          if [ -z "$hdf5_dll" ]; then
            echo 'HDF5 runtime DLL was not found in /ucrt64/bin' >&2
            exit 1
          fi
          cp "$hdf5_dll" /ucrt64/bin/hdf5.dll
          # Build the pinned SNT3 source with its MinGW TLS linker fix.
          source .github/scripts/build-snt3-windows.sh
          # Avoid --target here: Cargo then omits RUSTFLAGS from host build scripts.
          cargo build --release --locked -p h5jive --target-dir target/${{ matrix.target }}

      - name: Package Linux executable
        if: runner.os == 'Linux'
        run: |
          mkdir -p bundle/lib dist
          cp target/${{ matrix.target }}/release/h5jive bundle/
          cp -R settings/runtime bundle/settings
          printf '# Local settings overrides\n' > bundle/settings/overrides.dip
          cp README.md LICENSE bundle/
          cp "$RUNNER_TEMP/hdf5-1.10.11/COPYING" bundle/lib/HDF5-LICENSE
          # Resolve the custom HDF5 build before copying it and its compression helpers.
          LD_LIBRARY_PATH="$SNT3_HDF5_LIB_DIR${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" ldd bundle/h5jive \
            | awk '/=> \/.*lib(hdf5[^.]*|sz|aec|z)\.so/ {print $3}' | while read -r library; do
            cp -L "$library" bundle/lib/
          done
          patchelf --set-rpath '$ORIGIN/lib' bundle/h5jive
          for library in bundle/lib/*.so*; do
            [ -e "$library" ] && patchelf --set-rpath '$ORIGIN' "$library"
          done
          ldd bundle/h5jive | awk '/libhdf5/ && !/bundle\/lib/ {print "HDF5 library is not bundled: " $0 > "/dev/stderr"; exit 1}'
          if readelf -d bundle/lib/libhdf5.so* | grep -F 'libcurl.so'; then
            echo 'Linux release must not require a host libcurl for HDF5' >&2
            exit 1
          fi
          bundle_exe="$PWD/bundle/h5jive"
          (cd "$(mktemp -d)" && "$bundle_exe" --inspect)
          tar -C bundle -czf dist/${{ matrix.archive }} .

      - name: Smoke test Linux archive on openSUSE Leap
        if: runner.os == 'Linux'
        shell: bash
        run: |
          docker run --rm -v "$PWD/bundle:/opt/h5jive:ro" \
            registry.opensuse.org/opensuse/leap:16.0 \
            sh -euc 'cd /tmp; /opt/h5jive/h5jive --inspect'

      - name: Package macOS executable and libraries
        if: runner.os == 'macOS'
        run: |
          mkdir -p bundle/lib dist
          cp target/${{ matrix.target }}/release/h5jive bundle/
          cp -R settings/runtime bundle/settings
          printf '# Local settings overrides\n' > bundle/settings/overrides.dip
          cp README.md LICENSE bundle/
          dylibbundler -b -x bundle/h5jive -d bundle/lib -p @executable_path/lib
          find bundle/lib -type f -name '*.dylib' -exec codesign --force --sign - {} \;
          codesign --force --sign - bundle/h5jive
          bundle_exe="$PWD/bundle/h5jive"
          (cd "$(mktemp -d)" && "$bundle_exe" --inspect)
          tar -C bundle -czf dist/${{ matrix.archive }} .

      - name: Package Windows executable and libraries
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          mkdir -p bundle dist
          cp target/${{ matrix.target }}/release/h5jive.exe bundle/
          cp -R settings/runtime bundle/settings
          printf '# Local settings overrides\n' > bundle/settings/overrides.dip
          cp README.md LICENSE bundle/
          # Ship the UCRT64 DLLs referenced by the executable, including HDF5.
          ldd bundle/h5jive.exe | awk '/\/ucrt64\/bin\// {print $3}' | while read -r dll; do
            cp "$dll" bundle/
          done
          bundle_exe="$PWD/bundle/h5jive.exe"
          (cd "$(mktemp -d)" && "$bundle_exe" --inspect)
          (cd bundle && zip -qr ../dist/${{ matrix.archive }} .)

      - name: Build Linux AppImage
        if: runner.os == 'Linux'
        run: sh .github/scripts/package-linux-appimage.sh

      - name: Build macOS disk image
        if: runner.os == 'macOS'
        run: sh .github/scripts/package-macos-dmg.sh ${{ matrix.target == 'x86_64-apple-darwin' && 'x86_64' || 'aarch64' }}

      - name: Install Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build and smoke test Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Select-String -Path crates/h5jive/Cargo.toml -Pattern '^version = "([^"]+)"' | Select-Object -First 1).Matches.Groups[1].Value
          $env:H5JIVE_VERSION = $version
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' '.github\scripts\h5jive.iss'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installer = (Resolve-Path 'dist\h5jive-windows-x86_64-setup.exe').Path
          $installDir = Join-Path $env:RUNNER_TEMP 'H5JiveInstallerTest'
          $process = Start-Process -FilePath $installer -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$installDir`"") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          & (Join-Path $installDir 'h5jive.exe') --inspect
          if ($LASTEXITCODE -ne 0) { throw 'Installed app could not read its settings.' }
          if (-not (Test-Path (Join-Path $installDir 'settings\DIPfile'))) { throw 'Installed DIPL settings are missing.' }

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: dist/*
          if-no-files-found: error

  attach:
    needs: [prepare, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: h5jive-*
          path: dist
          merge-multiple: true
      - name: Attach native downloads to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          (cd dist && sha256sum h5jive-* > SHA256SUMS)
          gh release upload "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
