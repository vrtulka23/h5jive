name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: ${{ matrix.os }} (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-2022
            target: x86_64-pc-windows-gnu
    steps:
      - name: Preserve Unix line endings on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf input

      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake libclang-dev pkg-config \
            libhdf5-dev libxcb1-dev libxrandr-dev libdbus-1-dev libx11-dev \
            libwayland-dev libegl-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libgl1-mesa-dev libvulkan-dev

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: brew install hdf5 pkg-config llvm

      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: UCRT64
          path-type: inherit
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-hdf5
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-clang
            mingw-w64-ucrt-x86_64-pkgconf

      - name: Build and test on Linux
        if: runner.os == 'Linux'
        run: |
          cargo build --workspace --locked --target ${{ matrix.target }}
          cargo test --workspace --locked --target ${{ matrix.target }} -- --test-threads=1

      - name: Build and test on macOS
        if: runner.os == 'macOS'
        run: |
          export HDF5_DIR="$(brew --prefix hdf5)"
          export SNT3_HDF5_LIB_DIR="$HDF5_DIR/lib"
          export LIBCLANG_PATH="$(brew --prefix llvm)/lib"
          cargo build --workspace --locked --target ${{ matrix.target }}
          cargo test --workspace --locked --target ${{ matrix.target }} -- --test-threads=1

      - name: Build and test on Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          export HDF5_DIR=/ucrt64
          export HDF5_ROOT=/ucrt64
          export LIBCLANG_PATH=/ucrt64/bin
          export PKG_CONFIG_PATH=/ucrt64/lib/pkgconfig
          export CMAKE_GENERATOR=Ninja
          # hdf5-metno-sys checks a fixed list of DLL names; MSYS2 uses a versioned name.
          hdf5_dll=$(find /ucrt64/bin -maxdepth 1 -type f -name 'libhdf5-*.dll' -print -quit)
          if [ -z "$hdf5_dll" ]; then
            echo 'HDF5 runtime DLL was not found in /ucrt64/bin' >&2
            exit 1
          fi
          cp "$hdf5_dll" /ucrt64/bin/hdf5.dll
          # Build the pinned SNT3 source with its MinGW TLS linker fix.
          source .github/scripts/build-snt3-windows.sh
          cargo build --workspace --locked --target ${{ matrix.target }}
          cargo test --workspace --locked --target ${{ matrix.target }} -- --test-threads=1
