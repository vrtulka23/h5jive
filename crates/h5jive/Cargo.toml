[package]
name = "h5jive"
version = "0.1.1"
authors = ["Ondrej Pêgo Jaura"]
edition.workspace = true
license.workspace = true

[dependencies]
dear-app = { version = "0.22", features = ["implot"] }
dear-implot = "0.22"
font8x8 = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
h5jive-data = { path = "../data-source" }
scinumtools3 = "=0.10.1"
dunce = "1.0"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
xcap = "=0.4.0"

[target.'cfg(not(target_os = "linux"))'.dependencies]
xcap = "=0.9.8"

[dev-dependencies]
hdf5-metno = "0.15"

